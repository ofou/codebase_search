version: '3.8'

services:
  codebase-search-dev:
    build: .
    ports:
      - "8086:8086"
    volumes:
      - .:/app
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - ENABLE_BACKGROUND_INDEXING=true
      - ENABLE_FILE_WATCHING=true
      - INDEX_UPDATE_DELAY=1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["python3", "-u", "mcp_codebase_server.py"]

volumes:
  ollama_data:
